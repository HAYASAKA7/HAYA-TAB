name: HayaTab
options:
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HayaTab:
    type: application
    platform: iOS
    sources:
      - path: HayaTab
        excludes:
          - Resources
      - path: HayaTab/Resources/Viewer
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HAYA-TAB
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
  HayaTabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HayaTabTests
      - path: ../../shared/fixtures/fingerprint/v1
        buildPhase: resources
    dependencies:
      - target: HayaTab
    configFiles:
      Debug: Config/Test.xcconfig
      Release: Config/Test.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HayaTabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HayaTabUITests
    dependencies:
      - target: HayaTab
    configFiles:
      Debug: Config/Test.xcconfig
      Release: Config/Test.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HayaTab:
    build:
      targets:
        HayaTab: all
    test:
      gatherCoverageData: true
      targets:
        - HayaTabTests
        - HayaTabUITests
