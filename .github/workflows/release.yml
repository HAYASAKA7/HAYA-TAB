name: Release Build

on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows 64-bit (AMD64)
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: HAYA-TAB-windows-amd64

          # Windows 32-bit (x86)
          - os: windows-latest
            platform: windows
            arch: 386
            artifact_name: HAYA-TAB-windows-386

          # Windows ARM64
          - os: windows-latest
            platform: windows
            arch: arm64
            artifact_name: HAYA-TAB-windows-arm64

          # macOS AMD64 (Intel)
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact_name: HAYA-TAB-macos-amd64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: HAYA-TAB-macos-arm64

          # Linux AMD64
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact_name: HAYA-TAB-linux-amd64

          # Linux ARM64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact_name: HAYA-TAB-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            export GOFLAGS="-tags=webkit2_41"
            wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -clean
          else
            wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -clean
          fi
        shell: bash

      - name: Package Windows build
        if: matrix.platform == 'windows'
        run: |
          cd build/bin
          7z a ../../${{ matrix.artifact_name }}.zip HAYA-TAB.exe
        shell: bash

      - name: Package macOS build
        if: matrix.platform == 'darwin'
        run: |
          cd build/bin
          mkdir -p dmg
          cp -r HAYA-TAB.app dmg/
          hdiutil create -volname "HAYA-TAB" -srcfolder dmg -ov -format UDZO ../../${{ matrix.artifact_name }}.dmg
          rm -rf dmg

      - name: Package Linux build
        if: matrix.platform == 'linux'
        run: |
          cd build/bin
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz HAYA-TAB

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.dmg
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec mv {} . \;
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            HAYA-TAB-windows-amd64.zip
            HAYA-TAB-windows-386.zip
            HAYA-TAB-windows-arm64.zip
            HAYA-TAB-macos-amd64.dmg
            HAYA-TAB-macos-arm64.dmg
            HAYA-TAB-linux-amd64.tar.gz
            HAYA-TAB-linux-arm64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
