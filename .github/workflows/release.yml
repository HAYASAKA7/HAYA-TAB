name: Release Build

on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows 64-bit (AMD64)
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: HAYA-TAB-windows-amd64
            artifact_ext: zip

          # Windows 32-bit (x86)
          - os: windows-latest
            platform: windows
            arch: 386
            artifact_name: HAYA-TAB-windows-386
            artifact_ext: zip

          # Windows ARM64
          - os: windows-latest
            platform: windows
            arch: arm64
            artifact_name: HAYA-TAB-windows-arm64
            artifact_ext: zip

          # macOS AMD64 (Intel)
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact_name: HAYA-TAB-macos-amd64
            artifact_ext: dmg

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: HAYA-TAB-macos-arm64
            artifact_ext: dmg

          # Linux AMD64
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact_name: HAYA-TAB-linux-amd64
            artifact_ext: tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact_name: HAYA-TAB-linux-arm64
            artifact_ext: tar.gz

          # iOS distribution (simulator .app zip)
          # - os: macos-latest
          #   platform: ios
          #   arch: arm64
          #   artifact_name: HAYA-TAB-ios-arm64-simulator
          #   artifact_ext: zip

          # Android distribution (APK)
          # - os: ubuntu-24.04
          #   platform: android
          #   arch: arm64
          #   artifact_name: HAYA-TAB-android-arm64
          #   artifact_ext: apk

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails3
        # Keep the CLI aligned with go.mod. Newer Wails versions may require
        # a different Linux GTK/WebKit toolchain before the build starts.
        shell: bash
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            wails3 task windows:build ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            wails3 task darwin:package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            wails3 task linux:build ARCH=${{ matrix.arch }} EXTRA_TAGS=webkit2_41
          else
            echo "Unsupported platform: ${{ matrix.platform }}"
            exit 1
          fi
        shell: bash

      - name: Package Windows build
        if: matrix.platform == 'windows'
        run: |
          cd bin
          7z a ../${{ matrix.artifact_name }}.zip HAYA-TAB.exe
        shell: bash

      - name: Package macOS build
        if: matrix.platform == 'darwin'
        run: |
          cd bin
          mkdir -p dmg
          cp -r HAYA-TAB.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "HAYA-TAB" -srcfolder dmg -ov -format UDZO ../${{ matrix.artifact_name }}.dmg
          rm -rf dmg

      - name: Package Linux build
        if: matrix.platform == 'linux'
        run: |
          cd bin
          tar -czf ../${{ matrix.artifact_name }}.tar.gz HAYA-TAB

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
          if-no-files-found: error

  # TODO: Re-enable when Wails v3 has stable iOS and Android support
