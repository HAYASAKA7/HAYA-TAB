name: Release Build

on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows 64-bit (AMD64)
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: HAYA-TAB-windows-amd64
            artifact_ext: zip

          # Windows 32-bit (x86)
          - os: windows-latest
            platform: windows
            arch: 386
            artifact_name: HAYA-TAB-windows-386
            artifact_ext: zip

          # Windows ARM64
          - os: windows-latest
            platform: windows
            arch: arm64
            artifact_name: HAYA-TAB-windows-arm64
            artifact_ext: zip

          # macOS AMD64 (Intel)
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact_name: HAYA-TAB-macos-amd64
            artifact_ext: dmg

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: HAYA-TAB-macos-arm64
            artifact_ext: dmg

          # Linux AMD64
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact_name: HAYA-TAB-linux-amd64
            artifact_ext: tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact_name: HAYA-TAB-linux-arm64
            artifact_ext: tar.gz

          # iOS distribution (simulator .app zip)
          # - os: macos-latest
          #   platform: ios
          #   arch: arm64
          #   artifact_name: HAYA-TAB-ios-arm64-simulator
          #   artifact_ext: zip

          # Android distribution (APK)
          # - os: ubuntu-24.04
          #   platform: android
          #   arch: arm64
          #   artifact_name: HAYA-TAB-android-arm64
          #   artifact_ext: apk

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            wails3 task windows:build ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            wails3 task darwin:package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            wails3 task linux:build ARCH=${{ matrix.arch }} EXTRA_TAGS=webkit2_41
          else
            echo "Unsupported platform: ${{ matrix.platform }}"
            exit 1
          fi
        shell: bash

      - name: Package Windows build
        if: matrix.platform == 'windows'
        run: |
          cd bin
          7z a ../${{ matrix.artifact_name }}.zip HAYA-TAB.exe
        shell: bash

      - name: Package macOS build
        if: matrix.platform == 'darwin'
        run: |
          cd bin
          mkdir -p dmg
          cp -r HAYA-TAB.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "HAYA-TAB" -srcfolder dmg -ov -format UDZO ../${{ matrix.artifact_name }}.dmg
          rm -rf dmg

      - name: Package Linux build
        if: matrix.platform == 'linux'
        run: |
          cd bin
          tar -czf ../${{ matrix.artifact_name }}.tar.gz HAYA-TAB

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Xcode (iOS)
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
        shell: bash

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          wails3 task ios:compile:ios ARCH=arm64 PRODUCTION=true
          cp -f bin/haya-tab bin/HAYA-TAB
          wails3 task ios:create:app:bundle
          cd bin
          zip -r ../HAYA-TAB-ios-arm64-simulator.zip HAYA-TAB.app
        shell: bash

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: HAYA-TAB-ios-arm64-simulator
          path: HAYA-TAB-ios-arm64-simulator.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Java (Android)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK/NDK (Android)
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found on runner"
            exit 1
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          # sdkmanager closes stdin after accepting all prompts; with pipefail this can surface as a broken pipe from `yes`.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
        shell: bash

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Android release APK
        run: |
          set -euo pipefail
          wails3 task android:build ARCH=arm64 PRODUCTION=true
          wails3 task android:assemble:apk:release
          cp -f bin/HAYA-TAB-release.apk ./HAYA-TAB-android-arm64-release.apk
        shell: bash

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: HAYA-TAB-android-arm64-release
          path: HAYA-TAB-android-arm64-release.apk
          if-no-files-found: error

  release:
    needs: [build, build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.apk" \) -exec mv {} . \;
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            HAYA-TAB-windows-amd64.zip
            HAYA-TAB-windows-386.zip
            HAYA-TAB-windows-arm64.zip
            HAYA-TAB-macos-amd64.dmg
            HAYA-TAB-macos-arm64.dmg
            HAYA-TAB-linux-amd64.tar.gz
            HAYA-TAB-linux-arm64.tar.gz
            HAYA-TAB-ios-arm64-simulator.zip
            HAYA-TAB-android-arm64-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
