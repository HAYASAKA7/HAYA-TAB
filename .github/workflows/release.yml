  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.apk" \) -exec mv {} . \;
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            HAYA-TAB-windows-amd64.zip
            HAYA-TAB-windows-386.zip
            HAYA-TAB-windows-arm64.zip
            HAYA-TAB-macos-amd64.dmg
            HAYA-TAB-macos-arm64.dmg
            HAYA-TAB-linux-amd64.tar.gz
            HAYA-TAB-linux-arm64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
