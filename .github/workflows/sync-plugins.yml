name: Sync Plugins to External Repo

on:
  push:
    branches:
      - main
    paths:
      - 'internal/app/plugins/**'

jobs:
  sync-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Plugin Subfolder
        env:
          EXTERNAL_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          git subtree split --prefix=internal/app/plugins -b sync-branch
          git push https://HAYASAKA7:${EXTERNAL_TOKEN}@github.com/HAYASAKA7/HAYA-TAB-Plugins.git sync-branch:main --force