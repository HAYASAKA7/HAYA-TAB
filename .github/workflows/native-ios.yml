name: Native iOS

on:
  workflow_dispatch:
  push:
    branches: [main, feat/ios-native]
    paths:
      - '.github/workflows/native-ios.yml'
      - 'mobile/ios/**'
      - 'shared/contracts/**'
      - 'shared/fixtures/**'
      - 'scripts/generate-native-ios-project.sh'
  pull_request:
    paths:
      - '.github/workflows/native-ios.yml'
      - 'mobile/ios/**'
      - 'shared/contracts/**'
      - 'shared/fixtures/**'
      - 'scripts/generate-native-ios-project.sh'

concurrency:
  group: native-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift 6 ${{ matrix.device.label }} simulator
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - label: iPhone
            prefix: iPhone
          - label: iPad
            prefix: iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record Xcode and SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: ${sdk_version}"
          [[ "${sdk_version}" == 26.* ]]
          xcode_build="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
          echo "XCODE_BUILD=${xcode_build}" >> "${GITHUB_ENV}"

      - name: Restore pinned XcodeGen build
        id: xcodegen-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/haya-tab-build-tools/xcodegen-2.45.4
          key: xcodegen-2.45.4-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_BUILD }}

      - name: Generate native project
        shell: bash
        run: bash scripts/generate-native-ios-project.sh

      - name: Save pinned XcodeGen build
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/haya-tab-build-tools/xcodegen-2.45.4
          key: xcodegen-2.45.4-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_BUILD }}

      - name: Select simulator
        shell: bash
        env:
          DEVICE_PREFIX: ${{ matrix.device.prefix }}
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | \
            python3 -c 'import json,os,sys; d=json.load(sys.stdin); p=os.environ["DEVICE_PREFIX"]; print(next(x["udid"] for values in d["devices"].values() for x in values if x["name"].startswith(p) and x["isAvailable"]))')"
          echo "IOS_SIMULATOR_ID=${device_id}" >> "${GITHUB_ENV}"

      - name: Test native application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project mobile/ios/HayaTab.xcodeproj \
            -scheme HayaTab \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -resultBundlePath mobile/ios/HayaTabTests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee mobile/ios/xcodebuild.log

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ios-${{ matrix.device.label }}-test-diagnostics
          path: |
            mobile/ios/HayaTabTests.xcresult
            mobile/ios/xcodebuild.log
          if-no-files-found: warn
